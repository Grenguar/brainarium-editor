name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality

  validate-linux:
    name: Validate Ubuntu package launch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux package and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality
      - name: Build native Linux packages
        run: pnpm run make -- --arch x64
      - name: Install and launch the Debian package with sandboxing enabled
        run: |
          deb="$(find out/make -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          deb="$(realpath "$deb")"
          sudo apt-get install --yes "$deb"
          launch_log="$(mktemp)"
          setsid xvfb-run -a brainarium --user-data-dir="$(mktemp -d)" >"$launch_log" 2>&1 &
          launcher_pid=$!
          sleep 5
          if ! kill -0 "$launcher_pid" 2>/dev/null; then
            wait "$launcher_pid" || true
            cat "$launch_log"
            exit 1
          fi
          if grep -Fq "SUID sandbox helper binary" "$launch_log"; then
            cat "$launch_log"
            exit 1
          fi
          kill -- "-$launcher_pid"
          wait "$launcher_pid" || true
