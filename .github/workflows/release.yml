name: Release Brainarium

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }} assets
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable release input
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm run quality
      - name: Package unsigned macOS artifacts
        run: pnpm run make -- --arch "${{ matrix.arch }}"
      - name: Verify packaged app
        run: |
          app_path="$(find out -type d -name Brainarium.app -print -quit)"
          test -n "$app_path"
      - uses: actions/upload-artifact@v7
        with:
          name: brainarium-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip

  windows:
    name: Build Windows Setup x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Normalize checkout line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable release input
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${env:RELEASE_TAG}^{commit}"
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm run quality
      - name: Package Windows Setup
        run: pnpm run make -- --arch x64
      - uses: actions/upload-artifact@v7
        with:
          name: brainarium-windows-x64
          if-no-files-found: error
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg

  linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
      - name: Verify immutable release input
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm run quality
      - name: Package Debian and RPM artifacts
        run: pnpm run make -- --arch x64
      - name: Verify Linux sandbox helper metadata
        run: |
          mapfile -t debs < <(find out/make -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find out/make -type f -name '*.rpm' | sort)
          test "${#debs[@]}" -gt 0
          test "${#rpms[@]}" -gt 0
          for deb in "${debs[@]}"; do
            dpkg-deb --contents "$deb" | grep -E -- '^-rwsr-xr-x root/root .*chrome-sandbox$'
          done
          for rpm in "${rpms[@]}"; do
            rpm -qpl "$rpm" | grep -F -- '/chrome-sandbox'
          done
      - uses: actions/upload-artifact@v7
        with:
          name: brainarium-linux-x64
          if-no-files-found: error
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm

  publish:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release from the immutable tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -t artifacts < <(find release-artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.rpm' -o -name '*.zip' \) | sort)
          test "${#artifacts[@]}" -gt 0
          sha256sum "${artifacts[@]}" > release-artifacts/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${artifacts[@]}" release-artifacts/SHA256SUMS.txt --verify-tag --generate-notes
