name: Release Brainarium

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build signed macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable release input
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - name: Import Developer ID certificate and notarization key
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          BRAINARIUM_MACOS_CERTIFICATE_P12: ${{ secrets.BRAINARIUM_MACOS_CERTIFICATE_P12 }}
          BRAINARIUM_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BRAINARIUM_MACOS_CERTIFICATE_PASSWORD }}
          BRAINARIUM_MACOS_SIGNING_IDENTITY: ${{ secrets.BRAINARIUM_MACOS_SIGNING_IDENTITY }}
        run: |
          required=(
            APPLE_API_ISSUER
            APPLE_API_KEY_ID
            APPLE_API_KEY_P8_BASE64
            BRAINARIUM_MACOS_CERTIFICATE_P12
            BRAINARIUM_MACOS_CERTIFICATE_PASSWORD
            BRAINARIUM_MACOS_SIGNING_IDENTITY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: ${name}" >&2
              exit 1
            fi
          done

          keychain_path="${RUNNER_TEMP}/brainarium-release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="${RUNNER_TEMP}/brainarium-developer-id.p12"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$BRAINARIUM_MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$BRAINARIUM_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          {
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "BRAINARIUM_MACOS_SIGNING_IDENTITY=$BRAINARIUM_MACOS_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate unsigned production build
        run: pnpm run quality
      - name: Package, sign, and notarize
        env:
          BRAINARIUM_SIGN_MACOS: "true"
        run: pnpm run make -- --arch "${{ matrix.arch }}"
      - name: Verify signed app
        run: |
          app_path="$(find out -type d -name Brainarium.app -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: brainarium-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip

  windows:
    name: Build Windows Setup x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable release input
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${env:RELEASE_TAG}^{commit}"
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm run quality
      - name: Package Windows Setup
        run: pnpm run make -- --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: brainarium-windows-x64
          if-no-files-found: error
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg

  linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
      - name: Verify immutable release input
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          node -e "const packageJson = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + packageJson.version); }"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm run quality
      - name: Package Debian and RPM artifacts
        run: pnpm run make -- --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: brainarium-linux-x64
          if-no-files-found: error
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm

  publish:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release from the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -t artifacts < <(find release-artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.rpm' -o -name '*.zip' \) | sort)
          test "${#artifacts[@]}" -gt 0
          sha256sum "${artifacts[@]}" > release-artifacts/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${artifacts[@]}" release-artifacts/SHA256SUMS.txt --verify-tag --generate-notes
